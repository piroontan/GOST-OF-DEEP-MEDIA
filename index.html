/* =====================================================
   BUBBLES
===================================================== */

.bubble{

    position:absolute;

    bottom:-150px;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.25),
            rgba(229,9,20,.08) 45%,
            rgba(229,9,20,.02) 70%,

    border:

        inset 0 0 15px
        rgba(255,255,255,.08);

    animation:
        floatBubble
        linear infinite;

    opacity:.6;
}


@keyframes floatBubble{

    0%{

        transform:
            translateY(0)
            translateX(0)
            scale(.7);

        opacity:0;
    }

    10%{

        opacity:.6;
    }

    50%{

        transform:
            translateY(-55vh)
            translateX(50px)
            scale(1);
    }

    80%{

        opacity:.4;
    }

    100%{

        transform:

            translateX(-70px)

        opacity:0;
    }
}


/* =====================================================
   GLOW
===================================================== */

.glow{

    width:400px;

    height:400px;

    border-radius:50%;

    background:

    filter:blur(100px);

    z-index:-4;

    pointer-events:none;

    animation:
        glowMove
        10s ease-in-out infinite alternate;
}


.glow.one{

    top:10%;

    left:-150px;
}


.glow.two{

    bottom:0;

    right:-150px;

    animation-delay:3s;
}


@keyframes glowMove{

    from{

    }

    to{

    }
}

<script>


/* =====================================================
   BUBBLES
===================================================== */

const background =
document.getElementById("background");


for(let i=0;i<28;i++){

    const bubble =
        document.createElement("div");


    bubble.className =
        "bubble";


    const size =
        Math.floor(
            Math.random()*90
        ) + 20;


    bubble.style.width =
        size+"px";


    bubble.style.height =
        size+"px";


    bubble.style.left =
        Math.random()*100+"%";


    bubble.style.animationDuration =
        (Math.random()*15+12)+"s";


    bubble.style.animationDelay =
        (Math.random()*15)+"s";


    bubble.style.opacity =
        (Math.random()*.4+.15);


    background.appendChild(
        bubble
    );

}


/* =====================================================
   VISITOR
===================================================== */

let visitorID =
    localStorage.getItem(
        "arwa7_visitor"
    );


if(!visitorID){

    visitorID =
        "زائر #" +
        Math.floor(
            100000 +
            Math.random()*900000
        );


    localStorage.setItem(
        "arwa7_visitor",
        visitorID
    );

}


/* =====================================================
   POSTS
===================================================== */

let posts = [


{

    id:1,

    title:
        "البوابات الآن تعمل ويمكنك البناء وجمع الموارد داخل اللعبة",

    category:
        "Game",

    image:
        "1 (2).png",

    description:
        "أواجه مشكلة بسيطة في جر المقطورة، لكن اللعبة تعمل بسلاسة أفضل من السابق.",

    date:
        "14 أغسطس 2026",

    views:0,

    rating:0,

    ratings:0,

    comments:[]

},


{

    id:2,

    title:
        "قمت بتأجيل إصدار التحديث القادم للعبة التهريب",

    category:
        "Game",

    image:
        "1 (6).png",

    description:
        "أضفت نظام مطاردة جديد، لكن اللعبة لا تزال غير مكتملة.",

    date:
        "14 أغسطس 2026",

    views:0,

    rating:0,

    ratings:0,

    comments:[]

},


{

    id:3,

    title:
        "سيكون التحديث القادم متأخرًا للعبة",

    category:
        "Game",

    image:
        "1 (3).png",

    description:
        "أعمل على تحسين المجسمات وتقليل عدد الـ Polygons، كما أحاول تشغيل اللعبة على الهاتف.",

    date:
        "13 أغسطس 2026",

    views:0,

    rating:0,

    ratings:0,

    comments:[]

},


{

    id:4,

    title:
        "تطوير نظام شراء السيارات",

    category:
        "Game",

    image:
        "1 (4).png",

    description:
        "تطوير نظام شراء السيارات وقيادتها والكاميرا والحركة داخل المشروع.",

    date:
        "12 أغسطس 2026",

    views:0,

    rating:0,

    ratings:0,

    comments:[]

},


{

    id:5,

    title:
        "تحديث جديد قادم",

    category:
        "Game",

    image:
        "1 (1).png",

    description:
        "تحديث جديد قادم، وسأشارك تفاصيله والتطورات القادمة هنا.",

    date:
        "8 أغسطس 2026",

    views:0,

    rating:0,

    ratings:0,

    comments:[]

},


{

    id:6,

    title:
        "افتتاح الموقع",

    category:
        "Game",

    image:
        "1.png",

    description:
        "أتمنى أن ينال الموقع إعجابكم واهتمامكم.",

    date:
        "8 أغسطس 2026",

    views:0,

    rating:0,

    ratings:0,

    comments:[]

}

];


/* =====================================================
   LOAD DATA
===================================================== */

let saved =
    localStorage.getItem(
        "arwa7_posts"
    );


if(saved){

    try{

        let old =
            JSON.parse(saved);


        old.forEach(
            oldPost=>{

                let post =
                    posts.find(
                        p =>
                        p.id ===
                        oldPost.id
                    );


                if(post){

                    post.views =
                        oldPost.views || 0;


                    post.rating =
                        oldPost.rating || 0;


                    post.ratings =
                        oldPost.ratings || 0;


                    post.comments =
                        oldPost.comments || [];

                }

            }
        );

    }

    catch(e){

        console.log(
            "تعذر تحميل البيانات"
        );

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveData(){

    localStorage.setItem(

        "arwa7_posts",

        JSON.stringify(posts)

    );

}


/* =====================================================
   RENDER
===================================================== */

function renderPosts(list){

    const box =
        document.getElementById(
            "posts"
        );


    box.innerHTML = "";


    document.getElementById(
        "empty"
    ).style.display =

        list.length
        ? "none"
        : "block";


    list.forEach(
        post=>{


        let average =

            post.ratings > 0

            ?

            (
                post.rating /
                post.ratings
            ).toFixed(1)

            :

            "0.0";


        let commentsHTML =

            post.comments
            .slice(-5)
            .reverse()
            .map(
                comment=>`

                <div class="comment">

                    <b>

                        ${escapeHTML(
                            comment.user
                        )}

                    </b>

                    ${escapeHTML(
                        comment.text
                    )}

                </div>

            `
            )
            .join("");


        box.innerHTML += `

        <article
            class="post"
            data-category="${escapeHTML(
                post.category
            )}">


            <div class="post-image">

                <img
                    src="${post.image}"
                    alt="${escapeHTML(
                        post.title
                    )}"
                    loading="lazy">

            </div>


            <div class="content">


                <h2 class="title">

                    ${escapeHTML(
                        post.title
                    )}

                </h2>


                <p class="desc">

                    ${escapeHTML(
                        post.description
                    )}

                </p>


                <span class="tag">

                    #${escapeHTML(
                        post.category
                    )}

                </span>


                <div class="meta">

                    <span>

                        ${escapeHTML(
                            post.date
                        )}

                    </span>


                    <span>

                        ${post.comments.length}
                        تعليق

                    </span>

                </div>


                <div class="stats">

                    <span>

                        👁 ${post.views}

                    </span>


                    <span>

                        ⭐ ${average}

                    </span>


                    <span>

                        💬 ${post.comments.length}

                    </span>

                </div>


                <div class="rating">

                    <span>

                        قيّم:

                    </span>


                    <button
                        onclick="ratePost(${post.id},1)">

                        ★

                    </button>


                    <button
                        onclick="ratePost(${post.id},2)">

                        ★★

                    </button>


                    <button
                        onclick="ratePost(${post.id},3)">

                        ★★★

                    </button>


                    <button
                        onclick="ratePost(${post.id},4)">

                        ★★★★

                    </button>


                    <button
                        onclick="ratePost(${post.id},5)">

                        ★★★★★

                    </button>

                </div>


                <div class="comment-box">


                    <textarea
                        id="comment-${post.id}"
                        maxlength="500"
                        placeholder="اكتب تعليقًا مجهولًا..."></textarea>


                    <button
                        onclick="addComment(${post.id})">

                        نشر التعليق

                    </button>


                    <div class="comments">

                        ${commentsHTML}

                    </div>


                </div>


            </div>

        </article>

        `;

    });

}


/* =====================================================
   COMMENT
===================================================== */

function addComment(id){

    let post =
        posts.find(
            p =>
            p.id === id
        );


    let input =
        document.getElementById(
            "comment-"+id
        );


    let text =
        input.value.trim();


    if(!text){

        alert(
            "اكتب تعليقًا أولًا"
        );

        return;

    }


    post.comments.push({

        user:
            visitorID,

        text:
            text,

        date:
            new Date().toISOString()

    });


    input.value = "";


    saveData();


    renderPosts(posts);

}


/* =====================================================
   RATING
===================================================== */

function ratePost(id,value){

    let key =
        "arwa7_rated_"+id;


    if(
        localStorage.getItem(key)
    ){

        alert(
            "لقد قمت بتقييم هذا المنشور مسبقًا."
        );

        return;

    }


    let post =
        posts.find(
            p =>
            p.id === id
        );


    post.rating += value;

    post.ratings++;


    localStorage.setItem(
        key,
        "true"
    );


    saveData();


    renderPosts(posts);

}


/* =====================================================
   VIEWS
===================================================== */

function registerViews(){

    posts.forEach(
        post=>{

        let key =
            "arwa7_view_"+post.id;


        if(
            !sessionStorage.getItem(key)
        ){

            post.views++;


            sessionStorage.setItem(
                key,
                "true"
            );

        }

    });


    saveData();

}


/* =====================================================
   FILTER
===================================================== */

function filterPosts(
    category,
    button
){

    document
        .querySelectorAll(
            "nav button"
        )
        .forEach(
            btn=>{

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    if(
        category === "all"
    ){

        renderPosts(posts);

    }

    else{

        renderPosts(

            posts.filter(
                p =>
                p.category ===
                category
            )

        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   TOP BUTTON
===================================================== */

window.addEventListener(
    "scroll",
    ()=>{

        const btn =
            document.getElementById(
                "topButton"
            );


        if(
            window.scrollY > 400
        ){

            btn.style.display =
                "block";

        }

        else{

            btn.style.display =
                "none";

        }

    }
);


/* =====================================================
   START
===================================================== */

registerViews();

renderPosts(posts);

</script>

</body>

</html>
